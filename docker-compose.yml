services:
  db:
    # Pinned so ops commands are copy-pasteable instead of depending on the
    # project-and-hash name compose would otherwise generate.
    container_name: shopping-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopping}
      POSTGRES_DB: shopping
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: shopping-app
    build: .
    restart: unless-stopped
    environment:
      # Discrete variables rather than a URL, so a password containing / # or ?
      # doesn't have to be percent-encoded. `pg` reads these directly.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: shopping
      PGPASSWORD: ${POSTGRES_PASSWORD:-shopping}
      PGDATABASE: shopping
      # Used in the links the WhatsApp bot posts back into the group.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Everything below is only needed for the WhatsApp bot (see README).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      # Only needed for the baileys worker below.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      # Enables /api/health. Unset means the endpoint 404s.
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    # `default` is how app reaches db; `dokploy-network` is how Traefik reaches app.
    # Both are required — dropping `default` breaks the database connection.
    networks:
      - default
      - dokploy-network
    # Routing is declared here rather than in Dokploy's Domains tab, which has a
    # history of not generating usable Traefik config for compose stacks.
    # Set DOMAIN in the environment; without it these routers just never match.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.shopping.loadbalancer.server.port=3000"
      - "traefik.http.routers.shopping.rule=Host(`${DOMAIN:-shopping.localhost}`)"
      - "traefik.http.routers.shopping.entrypoints=websecure"
      # Let's Encrypt, which also renews fine behind a Cloudflare proxy: the
      # HTTP-01 challenge follows Cloudflare's redirect to HTTPS and does not
      # validate the origin certificate on the way. Only the very first
      # issuance deadlocks under SSL mode Full (strict) — see the README.
      # Using a Cloudflare origin certificate instead? Swap this line for:
      #   traefik.http.routers.shopping.tls=true
      - "traefik.http.routers.shopping.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shopping-web.rule=Host(`${DOMAIN:-shopping.localhost}`)"
      - "traefik.http.routers.shopping-web.entrypoints=web"
      - "traefik.http.routers.shopping-web.middlewares=shopping-to-https"
      - "traefik.http.middlewares.shopping-to-https.redirectscheme.scheme=https"

  # Unofficial WhatsApp transport — an alternative to Meta's Cloud API that
  # works in a group you already have. Off unless you ask for it:
  #   docker compose --profile baileys up -d --build
  # Then read the logs once to scan the pairing QR code.
  baileys:
    container_name: shopping-baileys
    build: ./worker
    profiles: [baileys]
    restart: unless-stopped
    environment:
      APP_URL: http://app:3000
      # Not marked required: compose interpolates this even when the profile is
      # inactive, which would break a plain `docker compose up`. The worker
      # exits with a clear message if it is unset.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      # Comma-separated group JIDs. Empty means the bot acts in no group at
      # all; unlisted groups are logged once so you can copy the JID in.
      ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
      # Set to pair with an 8-character code instead of a QR (digits only,
      # with country code). Only used until the session is established.
      BAILEYS_PAIR_NUMBER: ${BAILEYS_PAIR_NUMBER:-}
    volumes:
      - baileys-auth:/data
    depends_on:
      - app

volumes:
  # Named explicitly for the same reason as the containers.
  db-data:
    name: shopping-db-data
  baileys-auth:
    name: shopping-baileys-auth

# Created by Dokploy. Locally: docker network create dokploy-network
networks:
  dokploy-network:
    external: true
