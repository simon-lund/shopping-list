services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopping}
      POSTGRES_DB: shopping
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shopping:${POSTGRES_PASSWORD:-shopping}@db:5432/shopping
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db-data:
