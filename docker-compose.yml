services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopping}
      POSTGRES_DB: shopping
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shopping:${POSTGRES_PASSWORD:-shopping}@db:5432/shopping
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    # `default` is how app reaches db; `dokploy-network` is how Traefik reaches app.
    # Both are required — dropping `default` breaks the database connection.
    networks:
      - default
      - dokploy-network
    # Routing is declared here rather than in Dokploy's Domains tab, which has a
    # history of not generating usable Traefik config for compose stacks.
    # Set DOMAIN in the environment; without it these routers just never match.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.shopping.loadbalancer.server.port=3000"
      - "traefik.http.routers.shopping.rule=Host(`${DOMAIN:-shopping.localhost}`)"
      - "traefik.http.routers.shopping.entrypoints=websecure"
      - "traefik.http.routers.shopping.tls.certresolver=letsencrypt"
      - "traefik.http.routers.shopping-web.rule=Host(`${DOMAIN:-shopping.localhost}`)"
      - "traefik.http.routers.shopping-web.entrypoints=web"
      - "traefik.http.routers.shopping-web.middlewares=shopping-to-https"
      - "traefik.http.middlewares.shopping-to-https.redirectscheme.scheme=https"

volumes:
  db-data:

# Created by Dokploy. Locally: docker network create dokploy-network
networks:
  dokploy-network:
    external: true
